group 'top.autopc.show_network_interface_info'
version '1.0-SNAPSHOT'

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    namespace "top.autopc.show_network_interface_info"

    compileSdkVersion 34

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        minSdkVersion 21
    }
}

// The Kotlin Gradle Plugin is applied by AGP when built-in Kotlin is enabled
// (and by Flutter for apps that have not migrated yet), so this plugin does not
// apply it itself. Flutter warns about plugins that do and will fail builds
// that do in a future version. The Kotlin standard library comes with the
// Kotlin Gradle Plugin, so no explicit stdlib dependency is needed either.
